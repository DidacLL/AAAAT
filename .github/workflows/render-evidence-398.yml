name: Render evidence 398

on:
  workflow_dispatch:
  push:
    branches:
      - evidence/398-62d8227-render

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Package exact app
        run: npm run package
      - name: Capture real Electron renderer
        run: xvfb-run -a node evidence/render-398.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: render-evidence-398-62d8227
          path: evidence-output/
          if-no-files-found: error
