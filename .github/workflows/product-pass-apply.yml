name: Product pass applier

on:
  push:
    branches:
      - product/dogfood-workspace-ai-context
    paths:
      - scripts/product-pass-apply-v2.py
      - .github/workflows/product-pass-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: product/dogfood-workspace-ai-context
      - name: Apply integrated product pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path("scripts/product-pass-apply-v2.py")
          code = script.read_text(encoding="utf-8")
          code = code.replace(
              "'import { createOpenAiCompatibleProvider, type ModelProvider } from \"./ai-provider\";\\n',\n    'import { type ModelProvider } from \"./ai-provider\";\\nimport { createWorkspaceAiProvider } from \"./ai-prompt-service\";\\n',",
              "'import { AiProviderError, createOpenAiCompatibleProvider } from \"./ai-provider\";\\n',\n    'import { AiProviderError } from \"./ai-provider\";\\nimport { createWorkspaceAiProvider } from \"./ai-prompt-service\";\\n',",
          )
          exec(compile(code, str(script), "exec"), {"__file__": str(script), "__name__": "__main__"})
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify
        run: npm run verify
      - name: Commit applied edits
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "AAAAT product pass"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finish workspace demo reset and AI prompt transparency"
          git push origin HEAD:product/dogfood-workspace-ai-context
