name: Product pass applier

on:
  push:
    branches:
      - product/dogfood-workspace-ai-context
    paths:
      - scripts/product-pass-apply-v1c.py
      - .github/workflows/product-pass-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: product/dogfood-workspace-ai-context
      - name: Apply product pass edits
        run: python scripts/product-pass-apply-v1c.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Fast verification
        run: npm run verify
      - name: Commit applied edits
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "AAAAT product pass"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve retained offer and AI extraction context"
          git push origin HEAD:product/dogfood-workspace-ai-context
