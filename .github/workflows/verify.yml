name: Verify

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite*.ts"
      - "forge.config.*"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run build

  gate:
    name: Verification gate
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require package build
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "Application package build finished as $VERIFY_RESULT" >&2
            exit 1
          fi
          echo "Application package build passed." >> "$GITHUB_STEP_SUMMARY"
