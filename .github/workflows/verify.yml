name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite*.ts"
      - "vite*.mts"
      - "forge.config.*"
      - "tsconfig*.json"
      - "eslint.config.mjs"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite*.ts"
      - "vite*.mts"
      - "forge.config.*"
      - "tsconfig.json"
      - "eslint.config.mjs"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint