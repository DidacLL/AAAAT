name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  gate:
    name: Verification gate
    needs: [fast]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require typecheck
        shell: bash
        env:
          FAST_RESULT: ${{ needs.fast.result }}
        run: |
          set -euo pipefail
          if [[ "$FAST_RESULT" != "success" ]]; then
            echo "Fast verification finished as $FAST_RESULT" >&2
            exit 1
          fi
          echo "Typecheck passed." >> "$GITHUB_STEP_SUMMARY"
