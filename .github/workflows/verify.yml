name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: CI impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.classify.outputs.fast }}
      latex: ${{ steps.classify.outputs.latex }}
      linux_package: ${{ steps.classify.outputs.linux_package }}
      full_package: ${{ steps.classify.outputs.full_package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          fast=false
          latex=false
          linux_package=false
          full_package=false
          docs_only=true
          files=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            fast=true
            latex=true
            linux_package=true
            full_package=true
            docs_only=false
            files="(manual dispatch: full verification)"
          else
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"

            if [[ -z "${base:-}" || -z "${head:-}" ]]; then
              fast=true
              latex=true
              linux_package=true
              full_package=true
              docs_only=false
              files="(unbounded diff: fail-safe full verification)"
            else
              git diff --check "$base" "$head"
              files="$(git diff --name-only "$base" "$head")"

              while IFS= read -r file; do
                [[ -z "$file" ]] && continue

                case "$file" in
                  *.md|docs/*|.agentic/*|.agents/*|LICENSE)
                    continue
                    ;;
                esac

                docs_only=false
                fast=true

                case "$file" in
                  .github/workflows/*|package.json|package-lock.json)
                    latex=true
                    linux_package=true
                    full_package=true
                    ;;
                  forge.config.ts|forge.env.d.ts|vite.main.config.mts|vite.preload.config.mts|vite.renderer.config.mts|playwright.config.ts)
                    linux_package=true
                    full_package=true
                    ;;
                  src/preload/*|src/main/entry.ts|src/main/main.ts|src/main/latex-runner.ts|src/main/*workspace*.ts|src/main/*backup*.ts|src/main/*vscode*.ts|src/main/*mcp*.ts|src/main/external-command.ts)
                    linux_package=true
                    full_package=true
                    ;;
                  src/main/*|src/renderer/*|src/shared/*|migrations/*|index.html|test/desktop/m6-manual.spec.ts)
                    linux_package=true
                    ;;
                  test/desktop/*)
                    linux_package=true
                    full_package=true
                    ;;
                esac

                case "$file" in
                  src/main/latex/*|src/main/latex-runner.ts|src/main/document-service.ts|test/latex-portability.test.ts)
                    latex=true
                    ;;
                esac
              done <<< "$files"
            fi
          fi

          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "latex=$latex" >> "$GITHUB_OUTPUT"
          echo "linux_package=$linux_package" >> "$GITHUB_OUTPUT"
          echo "full_package=$full_package" >> "$GITHUB_OUTPUT"

          {
            echo "### CI impact"
            echo
            echo "- docs only: $docs_only"
            echo "- fast verification: $fast"
            echo "- LaTeX portability: $latex"
            echo "- Linux package/smoke: $linux_package"
            echo "- full cross-platform package/smoke: $full_package"
            echo
            echo "Changed paths:"
            echo '```text'
            printf '%s\n' "$files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fast:
    name: Fast verification
    needs: impact
    if: needs.impact.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  latex:
    name: LaTeX portability
    needs: impact
    if: needs.impact.outputs.latex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install compatible TeX engines
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-latex-base texlive-luatex texlive-xetex
      - name: Compile and prove unrelated-directory portability
        shell: bash
        run: AAAAT_LATEX_TEST=1 npx vitest run test/latex-portability.test.ts

  package_linux:
    name: Package and smoke (ubuntu-latest)
    needs: impact
    if: needs.impact.outputs.linux_package == 'true' && needs.impact.outputs.full_package != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Protected check context
        run: echo "Linux package evidence selected by CI impact."
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install Linux runtime prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes openbox xdotool
      - name: Build packaged app
        run: npm run package
      - name: Configure packaged Chromium sandbox
        shell: bash
        run: |
          sandbox_path="out/AAAAT-linux-$(node -p 'process.arch')/chrome-sandbox"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          stat -c '%U %a %n' "$sandbox_path"
      - name: Packaged runtime smoke
        shell: bash
        run: |
          xvfb-run --auto-servernum bash -lc '
            openbox >/tmp/aaaat-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            npm run test:desktop
          '

  package_full:
    name: Package and smoke (${{ matrix.os }})
    needs: impact
    if: needs.impact.outputs.full_package == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Protected check context
        run: echo "Cross-platform package evidence selected by CI impact."
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install Linux runtime prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot openbox xdotool
      - name: Build release artifact
        run: npm run make
      - name: Inspect Windows release ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path out/make -Recurse -File -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows release ZIP was not created" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            $entries | ForEach-Object { Write-Host $_ }
            $exe = $entries | Where-Object { $_.EndsWith("aaaat.exe", [System.StringComparison]::OrdinalIgnoreCase) } | Select-Object -First 1
            if (-not $exe) { throw "Windows release ZIP does not contain aaat.exe" }
          } finally {
            $archive.Dispose()
          }
      - name: Inspect macOS release ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          zip_path=$(find out/make -type f -name '*.zip' -print -quit)
          test -n "$zip_path"
          unzip -l "$zip_path" | grep -q 'AAAAT.app/Contents/MacOS/aaaat'
      - name: Inspect Linux release package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb_path=$(find out/make -type f -name '*.deb' -print -quit)
          test -n "$deb_path"
          dpkg-deb --info "$deb_path"
          dpkg-deb --contents "$deb_path" | tee /tmp/aaaat-deb-contents.txt
          grep -Eq '^-rwsr-xr-x root/root .*chrome-sandbox$' /tmp/aaaat-deb-contents.txt
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: AAAAT-${{ matrix.os }}-${{ runner.arch }}
          path: |
            out/make/**/*.zip
            out/make/**/*.deb
          if-no-files-found: error
          compression-level: 0
      - name: Install demonstrated VS Code host contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "vscode-1.134.0.zip"
          $hostRoot = Join-Path $env:RUNNER_TEMP "vscode-host"
          Invoke-WebRequest -Uri "https://update.code.visualstudio.com/1.134.0/win32-x64-archive/stable" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $hostRoot -Force
          $code = Join-Path $hostRoot "Code.exe"
          $cli = Get-ChildItem -Path $hostRoot -Recurse -File -Filter cli.js |
            Where-Object { $_.FullName -match '[\\/]resources[\\/]app[\\/]out[\\/]cli\.js$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $cli) { throw "VS Code CLI entrypoint not found" }
          $process = Start-Process -FilePath $code -ArgumentList @($cli, "--version") -Wait -PassThru -NoNewWindow -Environment @{ ELECTRON_RUN_AS_NODE = "1" }
          if ($process.ExitCode -ne 0) { throw "VS Code CLI validation failed with exit code $($process.ExitCode)" }
          "AAAAT_VSCODE_CLI=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AAAAT_VSCODE_CLI_SCRIPT=$cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure packaged Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox_path="out/AAAAT-linux-$(node -p 'process.arch')/chrome-sandbox"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          stat -c '%U %a %n' "$sandbox_path"
      - name: Packaged runtime smoke
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Packaged runtime smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum bash -lc '
            openbox >/tmp/aaaat-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            npm run test:desktop
          '
