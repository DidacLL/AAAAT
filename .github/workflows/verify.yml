name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  latex:
    name: LaTeX portability
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install compatible TeX engines
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-latex-base texlive-luatex texlive-xetex
      - name: Compile and prove unrelated-directory portability
        shell: bash
        run: AAAAT_LATEX_TEST=1 npx vitest run test/latex-portability.test.ts

  package:
    name: Package and smoke (${{ matrix.os }})
    needs: fast
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Verify TeX runner process behavior
        run: npx vitest run test/latex-runner.test.ts
      - run: npm run build
      - name: Install demonstrated VS Code host contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "vscode-1.134.0.zip"
          $hostRoot = Join-Path $env:RUNNER_TEMP "vscode-host"
          Invoke-WebRequest -Uri "https://update.code.visualstudio.com/1.134.0/win32-x64-archive/stable" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $hostRoot -Force
          $code = Join-Path $hostRoot "Code.exe"
          & $code --version
          "AAAAT_VSCODE_CLI=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure packaged Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox_path="out/AAAAT-linux-$(node -p 'process.arch')/chrome-sandbox"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          stat -c '%U %a %n' "$sandbox_path"
      - name: Install native dialog smoke helper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes openbox xdotool
      - name: Packaged runtime smoke
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Packaged runtime smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum bash -lc '
            openbox >/tmp/aaaat-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            npm run test:desktop
          '
