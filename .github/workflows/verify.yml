name: Verify

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite*.ts"
      - "forge.config.*"
      - "playwright.config.*"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  gate:
    name: Verification gate
    needs: typecheck
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lightweight verification
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          if [[ "$TYPECHECK_RESULT" != "success" ]]; then
            echo "Typecheck finished as $TYPECHECK_RESULT" >&2
            exit 1
          fi
          echo "Lightweight development verification passed." >> "$GITHUB_STEP_SUMMARY"
