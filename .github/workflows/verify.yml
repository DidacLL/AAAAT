name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "vite*.ts"
      - "vite*.mts"
      - "forge.config.*"
      - "tsconfig*.json"
      - "eslint.config.mjs"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Choose checks for changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          code=true
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            code=false
            git diff --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/aaaat-changed-files"
            while IFS= read -r -d '' file; do
              case "$file" in
                site/*|.github/workflows/pages.yml|*.md|docs/*|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.svg|LICENSE) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/aaaat-changed-files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" == "false" ]]; then
            echo "Website/documentation/images only: no installation, typecheck, lint or packaging required." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.code == 'true'
      - run: npm run typecheck
        if: steps.scope.outputs.code == 'true'
      - run: npm run lint
        if: steps.scope.outputs.code == 'true'
