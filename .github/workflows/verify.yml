name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  package:
    name: Package and smoke (${{ matrix.os }})
    needs: fast
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure packaged Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox_path="out/AAAAT-linux-$(node -p 'process.arch')/chrome-sandbox"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          stat -c '%U %a %n' "$sandbox_path"
      - name: Packaged runtime smoke
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Packaged runtime smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
