name: Temporary packaged demo locator fix

on:
  push:
    branches:
      - product/dogfood-workspace-ai-context
    paths:
      - scripts/fix-packaged-demo-locator.py
      - .github/workflows/apply-packaged-demo-locator.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: product/dogfood-workspace-ai-context
      - run: python scripts/fix-packaged-demo-locator.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Commit locator fix
        shell: bash
        run: |
          set -euo pipefail
          git add test/desktop/packaged-app.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "AAAAT product pass"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix packaged prompt guidance locator"
          git push origin HEAD:product/dogfood-workspace-ai-context
