name: Windows MCP spawn evidence

on:
  push:
    branches:
      - fix/windows-local-host-spawn-recovery
    paths:
      - ".github/workflows/windows-mcp-spawn-evidence.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Package AAAAT
        run: npm run package
      - name: Reproduce launcher npx.cmd boundary
        shell: pwsh
        run: |
          $probe = @'
          const { spawn } = require("node:child_process");
          const result = { command: "npx.cmd", args: ["--version"] };
          let child;
          try {
            child = spawn("npx.cmd", ["--version"], { stdio: "pipe" });
          } catch (error) {
            console.log("NPX_CMD_SPAWN", JSON.stringify({
              ...result,
              threwSynchronously: true,
              name: error.name,
              message: error.message,
              code: error.code ?? null,
              errno: error.errno ?? null,
              syscall: error.syscall ?? null,
            }));
            process.exit(0);
          }
          child.once("spawn", () => {
            console.log("NPX_CMD_SPAWN", JSON.stringify({
              ...result,
              threwSynchronously: false,
              spawned: true,
              pid: child.pid ?? null,
            }));
            child.kill();
          });
          child.once("error", (error) => {
            console.log("NPX_CMD_SPAWN", JSON.stringify({
              ...result,
              threwSynchronously: false,
              spawned: false,
              name: error.name,
              message: error.message,
              code: error.code ?? null,
              errno: error.errno ?? null,
              syscall: error.syscall ?? null,
            }));
          });
          child.once("close", () => process.exit(0));
          setTimeout(() => process.exit(0), 3000);
          '@
          node -e $probe
      - name: Reproduce direct spawn and MCP transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'out/AAAAT-win32-x64/aaaat.exe').Path
          $env:AAAAT_PACKAGED_EXECUTABLE = $exe
          $diagnostic = @'
          // @vitest-environment node
          import { spawn } from "node:child_process";
          import { existsSync, mkdtempSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import path from "node:path";
          import { Client } from "@modelcontextprotocol/client";
          import { StdioClientTransport } from "@modelcontextprotocol/client/stdio";
          import { describe, it } from "vitest";
          import { createOrOpenWorkspace } from "../../src/main/workspace";

          function envCopy(): Record<string, string> {
            return Object.fromEntries(
              Object.entries(process.env).filter(
                (entry): entry is [string, string] => typeof entry[1] === "string",
              ),
            );
          }

          function errorShape(reason: unknown) {
            if (!(reason instanceof Error)) return { value: String(reason) };
            const error = reason as NodeJS.ErrnoException & {
              path?: string;
              spawnargs?: string[];
            };
            return {
              name: error.name,
              message: error.message,
              code: error.code ?? null,
              errno: error.errno ?? null,
              syscall: error.syscall ?? null,
              path: error.path ?? null,
              spawnargs: error.spawnargs ?? null,
              stack: error.stack ?? null,
            };
          }

          describe("Windows packaged AAAAT spawn evidence", () => {
            it("compares raw spawn with MCP stdio transport", async () => {
              const command = process.env.AAAAT_PACKAGED_EXECUTABLE ?? "";
              const root = mkdtempSync(path.join(tmpdir(), "aaaat-windows-spawn-evidence-"));
              const args = ["--mcp", "--workspace", root];
              const env = envCopy();
              try {
                createOrOpenWorkspace(root);
                console.log("SPAWN_INPUT", JSON.stringify({
                  command,
                  commandExists: existsSync(command),
                  args,
                  cwd: process.cwd(),
                  envKeyCount: Object.keys(env).length,
                  envKeys: Object.keys(env).sort(),
                  commandHasOuterQuotes:
                    (command.startsWith('"') && command.endsWith('"')) ||
                    (command.startsWith("'") && command.endsWith("'")),
                }));

                await new Promise<void>((resolve, reject) => {
                  let spawned = false;
                  const child = spawn(command, args, {
                    cwd: process.cwd(),
                    env,
                    stdio: ["pipe", "pipe", "pipe"],
                    windowsHide: true,
                  });
                  child.once("spawn", () => {
                    spawned = true;
                    console.log("RAW_SPAWN", JSON.stringify({
                      succeeded: true,
                      pid: child.pid ?? null,
                    }));
                    setTimeout(() => child.kill(), 500);
                  });
                  child.once("error", (reason) => {
                    console.log("RAW_SPAWN", JSON.stringify({
                      succeeded: false,
                      error: errorShape(reason),
                    }));
                    reject(reason);
                  });
                  child.once("exit", (code, signal) => {
                    if (spawned) {
                      console.log("RAW_EXIT", JSON.stringify({ code, signal }));
                      resolve();
                    }
                  });
                });

                const transport = new StdioClientTransport({ command, args, env });
                const client = new Client({
                  name: "aaaat-windows-spawn-evidence",
                  version: "1.0.0",
                });
                try {
                  await client.connect(transport);
                  console.log("MCP_CONNECT", JSON.stringify({ succeeded: true }));
                  const listed = await client.listTools();
                  const names = listed.tools.map((tool) => tool.name);
                  console.log("MCP_LIST_TOOLS", JSON.stringify({
                    succeeded: true,
                    toolCount: names.length,
                    names,
                    hasApplicationDocumentsCreate:
                      names.includes("application_documents_create"),
                  }));
                } catch (reason) {
                  console.log("MCP_FAILURE", JSON.stringify({
                    error: errorShape(reason),
                  }));
                  throw reason;
                } finally {
                  await client.close().catch(() => undefined);
                }
              } finally {
                rmSync(root, { recursive: true, force: true, maxRetries: 5, retryDelay: 100 });
              }
            }, 60_000);
          });
          '@
          Set-Content -LiteralPath 'test/ai-eval/_windows-spawn-evidence.test.ts' -Value $diagnostic -Encoding utf8
          npx vitest run test/ai-eval/_windows-spawn-evidence.test.ts --reporter=verbose
      - name: Exercise actual host launcher with local compatible stub
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'out/AAAAT-win32-x64/aaaat.exe').Path
          $server = @'
          import http from "node:http";
          import fs from "node:fs";

          const logPath = process.env.AAAAT_STUB_LOG;
          const server = http.createServer(async (req, res) => {
            const chunks = [];
            for await (const chunk of req) chunks.push(chunk);
            const raw = Buffer.concat(chunks).toString("utf8");
            fs.appendFileSync(
              logPath,
              JSON.stringify({ method: req.method, url: req.url, body: raw }) + "\n",
              "utf8",
            );

            if (req.method === "GET" && req.url === "/v1/models") {
              res.writeHead(200, { "content-type": "application/json" });
              res.end(JSON.stringify({ object: "list", data: [{ id: "aaaat-eval" }] }));
              return;
            }

            if (req.method === "POST" && req.url === "/v1/chat/completions") {
              const body = JSON.parse(raw);
              const messages = Array.isArray(body.messages) ? body.messages : [];
              const hasToolResult = messages.some((message) => message?.role === "tool");
              const userText = messages
                .filter((message) => message?.role === "user")
                .map((message) => String(message.content ?? ""))
                .join("\n");

              let message;
              if (!hasToolResult && userText.includes("Northstar Robotics")) {
                message = {
                  role: "assistant",
                  content: null,
                  tool_calls: [{
                    id: "stub-call-1",
                    type: "function",
                    function: {
                      name: "application_documents_create",
                      arguments: JSON.stringify({
                        sourceText:
                          "Northstar Robotics is hiring a Platform Engineer in Barcelona to build TypeScript services and operate Kubernetes workloads.",
                        outputs: ["cv", "cover_letter"],
                      }),
                    },
                  }],
                };
              } else {
                message = {
                  role: "assistant",
                  content: "Stub response: no additional tool selected.",
                };
              }

              res.writeHead(200, { "content-type": "application/json" });
              res.end(JSON.stringify({
                id: "stub-completion",
                object: "chat.completion",
                choices: [{ index: 0, message, finish_reason: "stop" }],
              }));
              return;
            }

            res.writeHead(404, { "content-type": "application/json" });
            res.end(JSON.stringify({ error: "not found" }));
          });

          server.listen(18080, "127.0.0.1", () => {
            fs.writeFileSync(process.env.AAAAT_STUB_READY, "ready", "utf8");
          });
          '@
          Set-Content -LiteralPath 'stub-openai-server.mjs' -Value $server -Encoding utf8
          $env:AAAAT_STUB_LOG = (Join-Path $PWD 'stub-requests.jsonl')
          $env:AAAAT_STUB_READY = (Join-Path $PWD 'stub-ready.txt')
          $serverProcess = Start-Process node -ArgumentList 'stub-openai-server.mjs' -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 50 -and -not (Test-Path $env:AAAAT_STUB_READY); $i++) {
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-Path $env:AAAAT_STUB_READY)) {
              throw 'OpenAI-compatible stub did not start.'
            }

            $env:AAAAT_AI_EVAL_ENDPOINT = 'http://127.0.0.1:18080/v1'
            $env:AAAAT_AI_EVAL_MODEL = 'aaaat-eval'
            $env:AAAAT_AI_EVAL_CREDENTIAL = ''
            $env:AAAAT_AI_EVAL_REPETITIONS = '2'
            $env:AAAAT_AI_EVAL_TIMEOUT_SECONDS = '30'
            $env:AAAAT_PACKAGED_EXECUTABLE = $exe

            $driver = @(
              'const { spawn } = require("node:child_process");',
              'const child = spawn(process.execPath, ["scripts/ai-journey-eval.mjs", "--mode", "host"], { env: process.env, stdio: ["pipe", "inherit", "inherit"] });',
              'let sent = 0;',
              'const timer = setInterval(() => {',
              '  if (sent >= 5) { clearInterval(timer); return; }',
              '  child.stdin.write("\\n");',
              '  sent += 1;',
              '}, 350);',
              'child.once("error", (error) => { clearInterval(timer); console.error(error); process.exit(1); });',
              'child.once("exit", (code) => { clearInterval(timer); process.exit(code ?? 1); });'
            ) -join "`n"
            node -e $driver
            if ($LASTEXITCODE -ne 0) {
              throw "Host launcher exited with code $LASTEXITCODE"
            }

            $requestLines = @(Get-Content -LiteralPath $env:AAAAT_STUB_LOG)
            $chatRequests = @($requestLines | Where-Object { $_ -match '/v1/chat/completions' })
            if ($chatRequests.Count -lt 8) {
              throw "Expected repeated model requests, observed only $($chatRequests.Count)."
            }

            $report = Get-ChildItem -Path 'ai-eval-results' -Recurse -Filter 'llama-host.json' |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $report) { throw 'llama-host.json was not produced.' }
            $json = Get-Content -Raw -LiteralPath $report.FullName | ConvertFrom-Json
            if ($json.trials.Count -ne 8) {
              throw "Expected 8 scheduled trials, found $($json.trials.Count)."
            }
            $firstScenario = @($json.trials | Where-Object { $_.scenarioId -eq 'llama-create-documents' })
            if (-not ($firstScenario.evidence.toolCalls.name -contains 'application_documents_create')) {
              throw 'Integrated stub journey did not call application_documents_create.'
            }
            if (-not $json.extra.packagedMcp.directSpawnSucceeded) {
              throw 'Report did not preserve successful direct packaged spawn evidence.'
            }
            if (-not $json.extra.packagedMcp.mcpInitializationSucceeded) {
              throw 'Report did not preserve successful MCP initialization evidence.'
            }
            if (-not $json.extra.packagedMcp.mcpListToolsSucceeded) {
              throw 'Report did not preserve successful MCP listTools evidence.'
            }
            Write-Host "HOST_LAUNCHER_EVIDENCE trials=$($json.trials.Count) chatRequests=$($chatRequests.Count)"
            Write-Host "HOST_LAUNCHER_EVIDENCE firstScenarioToolCall=application_documents_create"
          }
          finally {
            if ($serverProcess -and -not $serverProcess.HasExited) {
              Stop-Process -Id $serverProcess.Id -Force
            }
          }