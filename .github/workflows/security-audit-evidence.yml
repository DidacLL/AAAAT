name: Security audit evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Full audit JSON
        shell: bash
        run: npm audit --json || true
      - name: Production-only audit JSON
        shell: bash
        run: npm audit --omit=dev --json || true
