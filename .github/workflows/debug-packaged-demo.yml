name: Temporary packaged demo diagnostic

on:
  push:
    branches:
      - product/dogfood-workspace-ai-context
    paths:
      - .github/workflows/debug-packaged-demo.yml

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: product/dogfood-workspace-ai-context
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Install Linux runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot openbox xdotool
      - name: Build packaged app
        run: npm run make
      - name: Configure packaged Chromium sandbox
        shell: bash
        run: |
          sandbox_path="out/AAAAT-linux-$(node -p 'process.arch')/chrome-sandbox"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
      - name: Run demo packaged test with API tracing
        env:
          DEBUG: pw:api
        shell: bash
        run: |
          xvfb-run --auto-servernum bash -lc '
            openbox >/tmp/aaaat-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            npx playwright test --config playwright.config.ts test/desktop/packaged-app.spec.ts --grep "packaged demo workspace" --timeout=120000
          '
