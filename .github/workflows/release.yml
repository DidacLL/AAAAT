name: Cross-platform release

on:
  workflow_dispatch:
  push:
    tags:
      - "v2*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Require tag to match package version
        if: startsWith(github.ref, 'refs/tags/v2')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
            artifact: windows-x64
          - label: Windows ARM64
            runner: windows-11-arm
            platform: win32
            arch: arm64
            artifact: windows-arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: darwin
            arch: x64
            artifact: macos-x64
          - label: macOS Apple Silicon
            runner: macos-15
            platform: darwin
            arch: arm64
            artifact: macos-arm64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: linux-x64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build native distributables
        if: runner.os != 'Windows'
        run: npm run make -- --arch=${{ matrix.arch }}
      - name: Build Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerInstaller
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Inno Setup signature could not be verified.' }
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'inno-compiler'
          $compilerProcess = Start-Process -FilePath $compilerInstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $compilerDirectory + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($compilerProcess.ExitCode -ne 0) { throw 'Could not install the build compiler.' }
          $env:ISCC_PATH = Join-Path $compilerDirectory 'ISCC.exe'
          npm run make -- --arch=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Normalize release artifacts
        run: node scripts/collect-release-artifacts.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: AAAAT-${{ matrix.artifact }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft:
    name: Prepare draft v2 release
    if: startsWith(github.ref, 'refs/tags/v2')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AAAAT-*
          path: release-artifacts
          merge-multiple: true
      - name: Attach assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-artifacts -maxdepth 1 -type f -print | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi

          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; leaving it unchanged." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi

          args=(--verify-tag --draft --title "AAAAT $GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${args[@]}"
