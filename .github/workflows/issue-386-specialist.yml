name: Issue 386 specialist

on:
  push:
    branches:
      - codex/issue-386-applications-coherence

permissions:
  contents: write

concurrency:
  group: issue-386-specialist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - name: Apply bounded implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue-386-transform-v2.py')
          text = path.read_text(encoding='utf-8')
          old = 'next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'next_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('regex helper patch target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/issue-386-transform-v2.py
      - name: Diff hygiene
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Focused Issue 386 tests
        run: npx vitest run test/candidature-projections.test.ts test/CandidatureOpportunityResearchAccessWorkspace.test.tsx test/NewApplicationRecovery.test.tsx test/CandidatureFieldCohesion.test.tsx test/CandidatureResponsiveLayout.test.ts
      - name: Ordinary Verify
        run: npm run verify
      - name: Commit verified implementation
        run: |
          rm .github/issue-386.patch .github/issue-386-transform.py .github/issue-386-transform-v2.py .github/workflows/issue-386-specialist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test .github
          git commit -m "fix: recover coherent Applications hierarchy"
          git push origin HEAD:codex/issue-386-applications-coherence
