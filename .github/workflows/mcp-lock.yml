name: MCP lock preservation

on:
  push:
    branches:
      - agentic/m4-official-mcp

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agentic/m4-official-mcp
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Preserve accepted lock shape while resolving MCP packages
        shell: bash
        run: |
          cp package.json /tmp/aaaat-package.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies={aaaat:"file:",...p.dependencies}; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n")'
          npm install --package-lock-only --ignore-scripts
          cp /tmp/aaaat-package.json package.json
      - name: Commit only the lockfile
        shell: bash
        run: |
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lock for official MCP packages"
          git push origin HEAD:agentic/m4-official-mcp
