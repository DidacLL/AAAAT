name: MCP lock regeneration

on:
  push:
    branches:
      - agentic/m4-official-mcp

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agentic/m4-official-mcp
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lock for official MCP test client"
          git push origin HEAD:agentic/m4-official-mcp
