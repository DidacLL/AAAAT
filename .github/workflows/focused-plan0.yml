name: Focused PLAN0 Verification

on:
  push:
    branches:
      - product/dogfood-workspace-ai-context

permissions:
  contents: read

jobs:
  focused:
    name: Focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Run focused PLAN0 tests
        run: >-
          npm test --
          test/candidature-field-guardrails.test.ts
          test/candidature-projections.test.ts
          test/CandidaturesWorkspace.test.tsx
          test/robust-job-extraction.test.ts
          test/ai-service.test.ts
          test/ai-connection-service.test.ts
          test/ProfileWorkspace.test.tsx
          test/AiSettingsWorkspace.test.tsx
          test/CandidatureFieldValueEditor.test.tsx
          test/WorkingCvEditor.test.tsx
