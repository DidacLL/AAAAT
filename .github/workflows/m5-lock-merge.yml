name: Temporary bounded lock merge

on:
  push:
    branches:
      - agentic/m5-release-artifacts

permissions:
  contents: write

jobs:
  merge-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - name: Preserve accepted lock shape and add only new maker closure
        shell: bash
        run: |
          cp package-lock.json /tmp/generated-lock.json
          git show origin/main:package-lock.json > /tmp/base-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const base = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8'));
          const generated = JSON.parse(fs.readFileSync('/tmp/generated-lock.json', 'utf8'));
          if (base.lockfileVersion !== generated.lockfileVersion) throw new Error('lockfile version changed');
          const root = base.packages[''];
          const generatedRoot = generated.packages[''];
          root.devDependencies ??= {};
          for (const name of ['@electron-forge/maker-deb', '@electron-forge/maker-zip']) {
            const value = generatedRoot.devDependencies?.[name];
            if (value !== '7.11.2') throw new Error(`unexpected ${name} root version: ${value}`);
            root.devDependencies[name] = value;
          }
          let added = 0;
          for (const [key, value] of Object.entries(generated.packages)) {
            if (key === '') continue;
            const existing = base.packages[key];
            if (!existing) {
              base.packages[key] = value;
              added += 1;
              continue;
            }
            for (const field of ['version', 'resolved', 'integrity']) {
              if (existing[field] !== value[field]) {
                throw new Error(`existing lock entry conflict at ${key} field ${field}`);
              }
            }
          }
          if (added === 0) throw new Error('maker closure added no lock entries');
          fs.writeFileSync('package-lock.json', JSON.stringify(base, null, 2) + '\n');
          console.log(`Added ${added} package entries without pruning accepted lock entries.`);
          NODE
      - name: Verify merged lock is installable
        run: npm ci --ignore-scripts
      - name: Reject broad lock churn
        shell: bash
        run: |
          numstat=$(git diff --numstat origin/main -- package-lock.json)
          additions=$(printf '%s\n' "$numstat" | cut -f1)
          deletions=$(printf '%s\n' "$numstat" | cut -f2)
          echo "package-lock diff: +${additions} -${deletions}"
          test "${deletions}" -le 20
      - name: Commit bounded lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Preserve lock shape for release makers"
          git push
