name: PLAN5 integrated rendered evidence

on:
  push:
    branches:
      - evidence/issue-393-final

permissions:
  contents: read

jobs:
  rendered-evidence:
    name: Exact-SHA integrated packaged evidence
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 7ec0a2fb69b192456245a0894575454cdc2e5553

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: source

      - name: Checkout evidence harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: harness

      - name: Prove evidence branch is non-product-only
        shell: pwsh
        working-directory: harness
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git diff --name-only "${{ env.CANDIDATE_SHA }}" HEAD)
          $allowed = @(
            '.github/workflows/plan5-integrated-evidence.yml',
            'test/desktop/plan5-integrated-evidence.spec.ts'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected evidence-branch changes: $($unexpected -join ', ')"
          }
          "candidate_sha=${{ env.CANDIDATE_SHA }}" | Set-Content ../candidate-boundary.txt
          "harness_sha=${{ github.sha }}" | Add-Content ../candidate-boundary.txt
          "changed_files=$($changed -join ';')" | Add-Content ../candidate-boundary.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Use pinned npm
        shell: pwsh
        run: npm install --global npm@11.19.0

      - name: Install exact candidate dependencies
        working-directory: source
        run: npm ci

      - name: Verify exact candidate
        working-directory: source
        run: npm run verify -- -- --testTimeout=60000

      - name: Package exact candidate
        working-directory: source
        run: npm run make

      - name: Add evidence harness after packaging
        shell: pwsh
        run: Copy-Item -LiteralPath harness/test/desktop/plan5-integrated-evidence.spec.ts -Destination source/test/desktop/plan5-integrated-evidence.spec.ts

      - name: Capture integrated packaged desktop evidence
        working-directory: source
        run: npx playwright test test/desktop/plan5-integrated-evidence.spec.ts --config playwright.config.ts

      - name: Add evidence metadata
        if: always()
        shell: pwsh
        run: |
          Copy-Item -LiteralPath candidate-boundary.txt -Destination source/plan5-evidence/candidate-boundary.txt
          $zip = Get-ChildItem -Path source/out/make -Recurse -File -Filter '*.zip' | Select-Object -First 1
          if ($null -ne $zip) {
            "package_zip=$($zip.Name)" | Add-Content source/plan5-evidence/candidate-boundary.txt
            "package_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant())" | Add-Content source/plan5-evidence/candidate-boundary.txt
          }

      - name: Upload integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLAN5-integrated-evidence-${{ env.CANDIDATE_SHA }}
          path: source/plan5-evidence/**
          if-no-files-found: error
          compression-level: 0
