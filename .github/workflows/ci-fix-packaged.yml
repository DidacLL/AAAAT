name: Temporary packaged test fix

on:
  push:
    branches:
      - product/dogfood-workspace-ai-context
    paths:
      - scripts/ci-fix-split-packaged.py
      - .github/workflows/ci-fix-packaged.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: product/dogfood-workspace-ai-context
      - name: Apply packaged test split
        run: python scripts/ci-fix-split-packaged.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git add test/desktop/packaged-app.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "AAAAT product pass"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Split packaged demo acceptance from security smoke"
          git push origin HEAD:product/dogfood-workspace-ai-context
